services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: urlshortener_app:latest
    container_name: urlshortener_app_prod
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-url_shortener}
      - DB_USERNAME=${DB_USERNAME:-urlshortener}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN}
    networks:
      - urlshortener
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: urlshortener_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - urlshortener
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: mysql:8.0
    container_name: urlshortener_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-url_shortener}
      MYSQL_USER: ${DB_USERNAME:-urlshortener}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - urlshortener
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: urlshortener_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    networks:
      - urlshortener
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    image: urlshortener_app:latest
    container_name: urlshortener_queue_prod
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-url_shortener}
      - DB_USERNAME=${DB_USERNAME:-urlshortener}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN}
    networks:
      - urlshortener
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  urlshortener:
    driver: bridge

volumes:
  db_data_prod:
  redis_data_prod:
