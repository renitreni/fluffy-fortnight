openapi: 3.1.0

info:
  title: URL Shortener Public API
  version: "1.0.0"
  description: |
    The URL Shortener public RESTful API allows developers to programmatically
    create, manage, and retrieve analytics for shortened links.

    **Authentication:** All API endpoints require a Bearer token issued via the
    dashboard's *API Keys* section. Pass it in the `Authorization` header:
    ```
    Authorization: Bearer <your-api-key>
    ```

    **Versioning:** The API uses URL-path versioning (`/api/v1/...`). Breaking
    changes will be introduced under a new major version segment.

    **Rate Limiting:** Responses include standard `X-RateLimit-*` headers.
    Default limits are plan-dependent (Free: 60 req/min, Pro: 600 req/min,
    Enterprise: custom).

    > ⚠️ **Note:** The internal Inertia.js pages are NOT documented here.
    > This specification covers only the programmatic public API.
  contact:
    name: API Support
    email: api-support@example.com
  license:
    name: Proprietary

servers:
  - url: http://localhost/api/v1
    description: Local development
  - url: https://your-domain.com/api/v1
    description: Production

tags:
  - name: Links
    description: Create and manage shortened URLs.
  - name: Analytics
    description: Retrieve click analytics for your links.
  - name: Domains
    description: Manage custom branded domains.
  - name: Account
    description: API key management and account information.

# ─────────────────────────────────────────────────────────────────────────────
# Security Schemes
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: API key generated in the dashboard. Pass as `Authorization: Bearer <key>`.

  # ── Reusable Schemas ──────────────────────────────────────────────────────
  schemas:

    Link:
      type: object
      description: A shortened URL resource.
      properties:
        id:
          type: integer
          readOnly: true
          example: 42
        short_code:
          type: string
          example: "aB3x9"
          description: Unique identifier appended to the base URL.
        short_url:
          type: string
          format: uri
          readOnly: true
          example: "https://your-domain.com/aB3x9"
        destination_url:
          type: string
          format: uri
          example: "https://www.example.com/very/long/path?utm_source=email"
        title:
          type: string
          nullable: true
          example: "Summer Campaign Landing Page"
        click_count:
          type: integer
          readOnly: true
          example: 1024
        is_active:
          type: boolean
          example: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-07-22T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-07-22T00:00:00Z"
      required:
        - id
        - short_code
        - short_url
        - destination_url
        - is_active

    CreateLinkRequest:
      type: object
      description: Payload for creating a new shortened link.
      properties:
        destination_url:
          type: string
          format: uri
          example: "https://www.example.com/very/long/path"
        custom_alias:
          type: string
          nullable: true
          minLength: 3
          maxLength: 64
          pattern: "^[a-zA-Z0-9_-]+$"
          example: "summer-sale"
          description: Optional custom short code. Must be unique and not a reserved word.
        title:
          type: string
          nullable: true
          maxLength: 255
          example: "Summer Campaign"
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"
        password:
          type: string
          nullable: true
          description: If set, visitors must enter this password to access the link.
        workspace_id:
          type: integer
          nullable: true
          example: 7
          description: Associate the link with a specific workspace. Defaults to personal workspace.
      required:
        - destination_url

    UpdateLinkRequest:
      type: object
      description: Payload for updating an existing link. All fields are optional.
      properties:
        destination_url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          nullable: true

    PaginatedLinks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
        links:
          type: object
          properties:
            first:
              type: string
              format: uri
              nullable: true
            last:
              type: string
              format: uri
              nullable: true
            prev:
              type: string
              format: uri
              nullable: true
            next:
              type: string
              format: uri
              nullable: true

    Error:
      type: object
      description: Standard error response envelope.
      properties:
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            destination_url: ["The destination url field is required."]

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"

  # ── Reusable Responses ────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Unauthenticated."

    Forbidden:
      description: Valid API key but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "This action is unauthorized."

    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "No query results for model [Link] 42."

    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Too Many Attempts."

  # ── Reusable Parameters ───────────────────────────────────────────────────
  parameters:
    LinkId:
      name: id
      in: path
      required: true
      description: The unique integer ID of the link.
      schema:
        type: integer
        example: 42

    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1

    PerPageParam:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 15
        maximum: 100

# ─────────────────────────────────────────────────────────────────────────────
# Global Security (override per-operation if needed)
# ─────────────────────────────────────────────────────────────────────────────
security:
  - BearerToken: []

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Links ─────────────────────────────────────────────────────────────────
  /links:
    get:
      summary: List links
      description: Returns a paginated list of links belonging to the authenticated user or workspace.
      operationId: listLinks
      tags: [Links]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: q
          in: query
          description: Filter by title or destination URL.
          required: false
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated list of links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      summary: Create a link
      description: Shortens a new URL and returns the created link resource.
      operationId: createLink
      tags: [Links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Link created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Link"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /links/{id}:
    parameters:
      - $ref: "#/components/parameters/LinkId"

    get:
      summary: Get a link
      description: Returns a single link by its ID.
      operationId: getLink
      tags: [Links]
      responses:
        "200":
          description: Link resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update a link
      description: Partially updates a link's metadata (title, destination, active status, expiry).
      operationId: updateLink
      tags: [Links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLinkRequest"
      responses:
        "200":
          description: Updated link resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Link"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete a link
      description: Permanently deletes the link. This also removes all associated click data.
      operationId: deleteLink
      tags: [Links]
      responses:
        "204":
          description: Link deleted. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Analytics (placeholder — implemented Day 17–21) ───────────────────────
  /links/{id}/analytics:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      summary: Get link analytics
      description: |
        Returns time-series click data and breakdown by country, device, and
        referrer for the specified link.

        > **Planned for Day 17–21.** This endpoint returns mock data in v0.
      operationId: getLinkAnalytics
      tags: [Analytics]
      parameters:
        - name: from
          in: query
          description: Start date (ISO 8601 date). Defaults to 30 days ago.
          required: false
          schema:
            type: string
            format: date
            example: "2026-06-22"
        - name: to
          in: query
          description: End date (ISO 8601 date). Defaults to today.
          required: false
          schema:
            type: string
            format: date
            example: "2026-07-22"
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [hourly, daily, weekly]
            default: daily
      responses:
        "200":
          description: Analytics data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_clicks:
                    type: integer
                    example: 1024
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2026-07-22"
                        clicks:
                          type: integer
                          example: 42
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Redirection (Public) ──────────────────────────────────────────────────
  /{shortCode}:
    get:
      summary: Redirect to original URL
      description: Resolves a short code and redirects the client to the destination URL. No authentication required.
      operationId: redirect
      tags: [Links]
      servers:
        - url: http://localhost
          description: Local development
        - url: https://your-domain.com
          description: Production
      security: [] # No auth required
      parameters:
        - name: shortCode
          in: path
          required: true
          description: The Base62 encoded short code.
          schema:
            type: string
            example: "aB3x9"
      responses:
        "302":
          description: Found - Redirects to the original URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: The destination URL.
        "404":
          description: Not Found - The short code is invalid, inactive, or soft-deleted.
        "410":
          description: Gone - The short link has expired.
